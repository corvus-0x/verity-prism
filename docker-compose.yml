services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: catalyst
      POSTGRES_PASSWORD: catalyst
      POSTGRES_DB: catalyst
    # Host port 5433 (not the default 5432) so Prism's db never collides with
    # the Catalyst stack, which publishes host 5432. Container port stays 5432,
    # so internal URLs (DATABASE_URL=...@db:5432) are unchanged.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    # Host port 8001 (not the default 8000) so Prism's backend never collides
    # with the Catalyst stack, which publishes host 8000. Container port stays
    # 8000, so the frontend proxy target (http://backend:8000) is unchanged.
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://catalyst:catalyst@db:5432/catalyst
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
